[global]
listen_addr = "127.0.0.1:47990"
backup_interval = "1h"
initial_delay = "2m"
max_mbps = 40.0

[local]
dest_root = "/var/lib/mc-backup"

[nas]
ssh_user = "backup"
ssh_host = "nas.local"
ssh_port = 22
ssh_key = "~/.ssh/id_ed25519"
dest_root = "/volume1/backups"

[retention]
prune_days = 7
prune_count = 0

[[watch]]
path = "/opt/minecraft/servers/docker/servers"
namespace = "minecraft"

# Per-server overrides are auto-generated on first discovery.
# Uncomment and edit to customize:
# [server.example]
# target = "nas"                 # or "local"
# pause_if_no_players = true   # skip backups when no one is online
