name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: rolling-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check formatting
        run: |
          if [ -n "$(gofmt -l .)" ]; then
            echo "The following files are not formatted properly:"
            gofmt -l .
            exit 1
          fi

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.55.2

      - name: Run vet
        run: go vet ./...

      - name: Run tests
        run: go test -race ./...

      - name: Build
        run: make build BINARY=mc-backup-linux-amd64 VERSION="${GITHUB_SHA::7}"

      - name: Generate checksum
        run: sha256sum mc-backup-linux-amd64 > mc-backup-linux-amd64.sha256

      - name: Update latest tag
        run: git push --force origin "${GITHUB_SHA}:refs/tags/latest"

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest main build
          body: Automated build from ${{ github.sha }}.
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            mc-backup-linux-amd64
            mc-backup-linux-amd64.sha256
